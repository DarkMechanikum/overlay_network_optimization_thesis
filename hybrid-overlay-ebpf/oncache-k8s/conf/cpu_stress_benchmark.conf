# Benchmark profile: synthetic CPU load on both nodes (stress-ng).
# Source as second arg: ./scripts/run_latency_benchmark_cpu_stress.sh ./conf/oncache_k8s_setup.conf ./conf/cpu_stress_benchmark.conf

WORKER_COUNTS="${WORKER_COUNTS:-1 8}"
REPEATS="${REPEATS:-2}"
DURATION_SEC="${DURATION_SEC:-30}"
WARMUP_SEC="${WARMUP_SEC:-15}"

NETPERF_TEST="${NETPERF_TEST:-TCP_RR}"
REQUEST_SIZE="${REQUEST_SIZE:-64}"
RESPONSE_SIZE="${RESPONSE_SIZE:-64}"
NETPERF_OUTPUT_FIELDS="${NETPERF_OUTPUT_FIELDS:-MEAN_LATENCY,TRANSACTION_RATE}"

REQUIRE_MAP_WARMUP="${REQUIRE_MAP_WARMUP:-1}"
MIN_EGRESS_ENTRIES="${MIN_EGRESS_ENTRIES:-1}"
MIN_INGRESS_ENTRIES="${MIN_INGRESS_ENTRIES:-1}"

CPU_STRESS_ENABLE=1
CPU_STRESS_LOAD=80
CPU_STRESS_RESERVE_CPUS=2
CPU_STRESS_WORKERS=0
CPU_STRESS_METHOD=cpu
CPU_STRESS_MIN_LOAD_FACTOR=0.4
