# Latency-first ONCache vs baseline benchmark on Kubernetes + Antrea.
# Source this from scripts/run_latency_benchmark.sh (or override via env).

# Worker counts are intentionally low to expose latency differences.
WORKER_COUNTS="${WORKER_COUNTS:-1 8 32}"
REPEATS="${REPEATS:-3}"
DURATION_SEC="${DURATION_SEC:-45}"
WARMUP_SEC="${WARMUP_SEC:-20}"

# Hot = established TCP (one connection per worker). Cold = new TCP per transaction (CRR).
HOT_NETPERF_TEST="${HOT_NETPERF_TEST:-${NETPERF_TEST:-TCP_RR}}"
COLD_NETPERF_TEST="${COLD_NETPERF_TEST:-TCP_CRR}"
# Space-separated list run for each mode: hot cold
BENCHMARK_FLOW_TYPES="${BENCHMARK_FLOW_TYPES:-hot cold}"

# Overlay modes to exercise in order. Supported: baseline oncache falcon hybrid.
# - baseline: standard Antrea overlay
# - oncache:  ONCache cache fast path only
# - falcon:   Falcon-style RPS/XPS multi-core fallback only (no ONCache)
# - hybrid:   ONCache fast path + Falcon-style multi-core fallback
#
# Default runs the full four-row matrix used in the thesis results table.
BENCHMARK_MODES="${BENCHMARK_MODES:-baseline oncache falcon hybrid}"
REQUEST_SIZE="${REQUEST_SIZE:-64}"
RESPONSE_SIZE="${RESPONSE_SIZE:-64}"
NETPERF_OUTPUT_FIELDS="${NETPERF_OUTPUT_FIELDS:-MEAN_LATENCY,TRANSACTION_RATE}"
# Extra seconds on netperf timeout for cold (CRR is slower at high worker counts).
COLD_RUN_TIMEOUT_EXTRA_SEC="${COLD_RUN_TIMEOUT_EXTRA_SEC:-60}"

# Gate ONCache runs on map readiness.
REQUIRE_MAP_WARMUP="${REQUIRE_MAP_WARMUP:-1}"
MIN_EGRESS_ENTRIES="${MIN_EGRESS_ENTRIES:-1}"
MIN_INGRESS_ENTRIES="${MIN_INGRESS_ENTRIES:-1}"

# Results root (script will create a timestamped subdirectory).
RESULT_ROOT="${RESULT_ROOT:-$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")/.." && pwd)/results/k8s-latency}"

# Use run_latency_benchmark_overlay_stress.sh for MTU + NetworkPolicy stress (recommended).
OVERLAY_STRESS_ENABLE="${OVERLAY_STRESS_ENABLE:-0}"
