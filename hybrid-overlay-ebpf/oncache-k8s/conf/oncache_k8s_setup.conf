# Kubernetes + Antrea lab for ONCache reference benchmarks.
# Control plane runs on MASTER_HOST; pods are pinned to SERVER_HOST / CLIENT_HOST.

MASTER_HOST="server1"
SERVER_HOST="server1"
CLIENT_HOST="server2"
SSH_OPTS=""

# Node names in kubeadm (must match provision script).
SERVER_NODE_NAME="node1"
CLIENT_NODE_NAME="node2"

# Underlay IPs used for kubeadm --node-ip (discovered automatically if empty).
SERVER_NODE_IP="37.27.135.239"
CLIENT_NODE_IP="195.201.193.69"

POD_NETWORK_CIDR="10.10.0.0/16"
# v1.10.0 is too old for Kubernetes 1.28; use a newer supported release.
ANTREA_VERSION="v1.15.2"

SERVER_POD="netperf-server"
CLIENT_POD="netperf-client"
NAMESPACE="default"
POD_IFNAME="eth0"

# TC hooks / ONCache attach on transport NIC (VLAN when vSwitch is up).
SERVER_NODE_IFNAME="enp4s0.4000"
CLIENT_NODE_IFNAME="enp1s0.4000"

# Physical NIC + optional VLAN underlay (vSwitch).
SERVER_PHY_IFNAME="enp4s0"
CLIENT_PHY_IFNAME="enp1s0"
SERVER_VLAN_IFNAME="enp4s0.4000"
CLIENT_VLAN_IFNAME="enp1s0.4000"
SERVER_UNDERLAY="168.119.133.106"
CLIENT_UNDERLAY="168.119.133.107"

# Synthetic overlay load (low MTU + many NetworkPolicies) for stress benchmark.
OVERLAY_STRESS_ENABLE="${OVERLAY_STRESS_ENABLE:-0}"
OVERLAY_STRESS_MTU=1280
OVERLAY_STRESS_POLICY_COUNT=150
OVERLAY_STRESS_RESTORE_MTU=1450

# Synthetic CPU load (stress-ng on both nodes during benchmark).
CPU_STRESS_ENABLE="${CPU_STRESS_ENABLE:-0}"
CPU_STRESS_LOAD=70
CPU_STRESS_RESERVE_CPUS=2
CPU_STRESS_WORKERS=0
CPU_STRESS_METHOD=cpu
CPU_STRESS_MIN_LOAD_FACTOR=0.4

REMOTE_ONCACHE_DIR="/root/ONCache"
REMOTE_SETUP_DIR="/root/oncache-k8s"

NETPERF_IMAGE="cilium/netperf"
