# ONCache Docker Swarm lab configuration.
# Used by scripts in hybrid-overlay-ebpf/oncache-docker/.

SERVER_HOST="server1"
CLIENT_HOST="server2"
SSH_OPTS=""

SERVER_CONTAINER="netperf-server"
CLIENT_CONTAINER="netperf-client"
OVERLAY_NETWORK="bench-net"
CONTAINER_IFNAME="eth0"

# Ipvlan parent + tc hooks on VLAN 4000 (vSwitch underlay).
SERVER_NODE_IFNAME="enp4s0.4000"
CLIENT_NODE_IFNAME="enp1s0.4000"
# Physical NICs (optional; used if scripts need bare metal name).
SERVER_PHY_IFNAME="enp4s0"
CLIENT_PHY_IFNAME="enp1s0"

# vSwitch / Cloud Network underlay (VLAN subinterface addresses).
SERVER_UNDERLAY="168.119.133.106"
CLIENT_UNDERLAY="168.119.133.107"

# Optional override. Leave empty to discover from docker inspect.
SERVER_CONTAINER_IP=""
CLIENT_CONTAINER_IP=""

# Remote install/build path on each host.
REMOTE_ONCACHE_DIR="/root/ONCache"
REMOTE_SETUP_DIR="/root/oncache-docker"

# Swarm overlay does not use Antrea/OVS. Keep this disabled.
ENABLE_OVS_HOOKS=0
