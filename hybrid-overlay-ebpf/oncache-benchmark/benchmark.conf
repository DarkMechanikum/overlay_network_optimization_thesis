# Unified mixed netperf benchmark (Docker, two hosts).
# Usage:
#   ./run_mixed_netperf.sh ./benchmark.conf
#
# RUN_MODE:
#   baseline — ONCache stopped, same ipvlan containers as oncache runs.
#   oncache  — full ONCache (sync, rebuild with ONCACHE_OVERLAY_FLAGS='', start daemon, warmup).
#
# This file extends oncache-docker lab settings (hosts, NICs, container names, remote paths).

# shellcheck source=/dev/null
source "$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)/../oncache-docker/conf/oncache_real_setup.conf"

ONCACHE_CONF="${ONCACHE_CONF:-$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)/../oncache-docker/conf/oncache_real_setup.conf}"

# --- Run selection (override with env: RUN_MODE=oncache ./run_mixed_netperf.sh ...) ---
RUN_MODE="${RUN_MODE:-baseline}"

# --- Workload ---
HOT_WORKERS=2048
COLD_WORKERS=2048
DURATION_SEC=60
WARMUP_SEC=10
REQUEST_SIZE=64
RESPONSE_SIZE=64
NETSERVER_PORT=12865
NETPERF_EXTRA_ARGS=""
NETPERF_OUTPUT_FIELDS="MEAN_LATENCY,TRANSACTION_RATE"
HOT_START_BATCH_SIZE=128
COLD_START_BATCH_SIZE=128
BATCH_SLEEP_SEC=0.2
KUBECTL_EXEC_TIMEOUT="120s"

LATENCY_MIN_ELAPSED_FRAC=0.95
LATENCY_MIN_TXN_RATE_HOT=10
LATENCY_MIN_TXN_RATE_COLD=0.5

# --- Lab network (ipvlan L3 + full ONCache masq) ---
IPVLAN_PREPARE_EACH_RUN="${IPVLAN_PREPARE_EACH_RUN:-0}"
OVERLAY_PREPARE_EACH_RUN="${OVERLAY_PREPARE_EACH_RUN:-1}"
IPVLAN_NETWORK_NAME="${IPVLAN_NETWORK_NAME:-bench-ipvlan}"
IPVLAN_SUBNET="${IPVLAN_SUBNET:-10.0.3.0/24}"
IPVLAN_GATEWAY="${IPVLAN_GATEWAY:-10.0.3.1}"
IPVLAN_SERVER_IP="${IPVLAN_SERVER_IP:-10.0.3.2}"
IPVLAN_CLIENT_IP="${IPVLAN_CLIENT_IP:-10.0.3.3}"
# Hetzner vSwitch host IPs on enp*.4000 (VLAN 4000, not container IPs). Cross-host uses gre-oncache when vSwitch is down.
SERVER_UNDERLAY="${SERVER_UNDERLAY:-168.119.133.106}"
CLIENT_UNDERLAY="${CLIENT_UNDERLAY:-168.119.133.107}"
GRE_IFACE="${GRE_IFACE:-gre-oncache}"

# --- Results / optional link test ---
RESULT_ROOT="./results"
MEASURE_LINK_LIMIT=0
IPERF3_PORT=5202
IPERF3_DURATION_SEC=10
IPERF3_PARALLEL=4
LINK_LIMIT_GBPS_OVERRIDE=""
CPU_SAMPLE_INTERVAL=1
COLLECT_SOFTIRQS=1
AUTO_SERVER_CONTAINER_IP=1

# --- ONCache (used only when RUN_MODE=oncache) ---
ONCACHE_REBUILD_ON_START=1
ONCACHE_WARMUP_SEC=30
ONCACHE_WARMUP_TCP_RR_WORKERS=8
REQUIRE_ONCACHE_FASTPATH=1
ONCACHE_FASTPATH_MIN_EGRESS_CACHE=1
STOP_ONCACHE_ON_EXIT=0
RESTART_ONCACHE=1
CONTAINER_IFNAME="eth0"
