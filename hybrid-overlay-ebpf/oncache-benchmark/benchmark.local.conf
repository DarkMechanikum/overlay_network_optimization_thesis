# Local benchmark on server3/server4 (LAN underlay).
# shellcheck source=/dev/null
source "$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)/../oncache-docker/conf/oncache_local_lab.conf"

RUN_MODE="${RUN_MODE:-baseline}"

ONCACHE_CONF="/home/vlad/overlay_network_optimization_thesis/hybrid-overlay-ebpf/oncache-docker/conf/oncache_local_lab.conf"

HOT_WORKERS=4096
COLD_WORKERS=4096
DURATION_SEC=60
WARMUP_SEC=10
REQUEST_SIZE=64
RESPONSE_SIZE=64
NETSERVER_PORT=12865
NETPERF_EXTRA_ARGS=""
NETPERF_OUTPUT_FIELDS="MEAN_LATENCY,TRANSACTION_RATE"
HOT_START_BATCH_SIZE=128
COLD_START_BATCH_SIZE=128
BATCH_SLEEP_SEC=0.2

LATENCY_MIN_ELAPSED_FRAC=0.95
LATENCY_MIN_TXN_RATE_HOT=10
LATENCY_MIN_TXN_RATE_COLD=0.5

IPVLAN_PREPARE_EACH_RUN="${IPVLAN_PREPARE_EACH_RUN:-1}"
OVERLAY_PREPARE_EACH_RUN="${OVERLAY_PREPARE_EACH_RUN:-0}"
IPVLAN_NETWORK_NAME="${IPVLAN_NETWORK_NAME:-bench-ipvlan}"
IPVLAN_SUBNET="${IPVLAN_SUBNET:-10.0.3.0/24}"
IPVLAN_GATEWAY="${IPVLAN_GATEWAY:-10.0.3.1}"
IPVLAN_SERVER_IP="${IPVLAN_SERVER_IP:-10.0.3.2}"
IPVLAN_CLIENT_IP="${IPVLAN_CLIENT_IP:-10.0.3.3}"

# LAN underlay (must match reachable host IPs).
SERVER_UNDERLAY="${SERVER_UNDERLAY:-192.168.40.136}"
CLIENT_UNDERLAY="${CLIENT_UNDERLAY:-192.168.40.177}"

GRE_IFACE="${GRE_IFACE:-gre-oncache}"

RESULT_ROOT="./results"
MEASURE_LINK_LIMIT=0
CPU_SAMPLE_INTERVAL=1
COLLECT_SOFTIRQS=1
AUTO_SERVER_CONTAINER_IP=1

ONCACHE_REBUILD_ON_START=1
ONCACHE_WARMUP_SEC=30
ONCACHE_WARMUP_TCP_RR_WORKERS=8
REQUIRE_ONCACHE_FASTPATH=1
ONCACHE_FASTPATH_MIN_EGRESS_CACHE=1
STOP_ONCACHE_ON_EXIT=0
RESTART_ONCACHE=1
CONTAINER_IFNAME="eth0"
