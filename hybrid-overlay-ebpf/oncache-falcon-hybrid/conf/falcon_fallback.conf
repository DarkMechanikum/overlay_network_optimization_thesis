# Tunables for the Falcon-style multi-core fallback applied alongside ONCache
# in the hybrid MVP.
#
# All values can be overridden via environment variables when invoking the
# apply/revert scripts (see oncache-falcon-hybrid/scripts/*.sh).

# Hex CPU mask written to /sys/class/net/<iface>/queues/rx-N/rps_cpus.
# Empty string => auto-compute "all online CPUs" from `nproc`.
FALCON_RPS_CPU_MASK="${FALCON_RPS_CPU_MASK:-}"

# Hex CPU mask for /sys/class/net/<iface>/queues/tx-N/xps_cpus. Empty => same
# auto-computed mask as RPS. Set to "skip" to leave XPS untouched.
FALCON_XPS_CPU_MASK="${FALCON_XPS_CPU_MASK:-}"

# Interface name patterns to tune in addition to the explicit transport and
# physical NICs from the K8s setup config. Space-separated extended-regex
# patterns matched against /sys/class/net entries.
FALCON_EXTRA_IFACE_PATTERNS="${FALCON_EXTRA_IFACE_PATTERNS:-^genev_sys ^antrea-gw ^ovs-system$}"

# Directory on each node used to persist the original rps_cpus / xps_cpus
# values so revert restores them exactly.
FALCON_STATE_DIR="${FALCON_STATE_DIR:-/var/lib/oncache-hybrid}"

# Best-effort net.core sysctls to raise softirq budget while the fallback is
# active. Skipped when empty.
FALCON_NETDEV_BUDGET="${FALCON_NETDEV_BUDGET:-600}"
FALCON_NETDEV_MAX_BACKLOG="${FALCON_NETDEV_MAX_BACKLOG:-4096}"
